name: Test Wikipedia member lookup (diagnostic)

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated group names"
        required: false
        default: "TXT,KiiiKiii,aespa,TWICE,BABYMONSTER,IVE"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test_wikipedia_lookup.mjs
        env:
          NAMES: ${{ github.event.inputs.names }}
