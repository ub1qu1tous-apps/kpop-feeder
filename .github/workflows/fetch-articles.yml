name: Fetch articles

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      group_key:
        description: "Group key to fetch (leave empty to fetch all groups)"
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Backstop: normal runs finish in well under 2 minutes. If something
    # hangs again (a feed/site that doesn't respond, despite the request
    # timeouts in the script), this kills the run instead of it sitting
    # there indefinitely until someone notices and cancels it by hand.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_and_store.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROUP_KEY: ${{ github.event.inputs.group_key }}
