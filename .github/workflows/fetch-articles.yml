name: Fetch articles

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      group_key:
        description: "Group key to fetch (leave empty to fetch all groups)"
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_and_store.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROUP_KEY: ${{ github.event.inputs.group_key }}
