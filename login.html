<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kpop-feeder admin</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=12" />
  <link rel="stylesheet" href="css/style.css?v=12" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="index.html" class="back">&larr; groups</a>
    </header>

    <h1>Admin login</h1>
    <form class="stacked" id="login-form">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="primary">Log in</button>
      <p class="error-text" id="login-error"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=12"></script>
  <script src="js/supabase-client.js?v=12"></script>
  <script src="js/login.js?v=12"></script>
</body>
</html>
