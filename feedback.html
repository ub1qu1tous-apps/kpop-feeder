<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kpop-feeder feedback</title>
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a href="index.html" class="back">&larr; groups</a>
    </header>

    <h1>Feedback &amp; group requests</h1>
    <p class="hint">Report a bug, ask for a group to be added, or leave any other feedback. Posts here are public and anyone can read them.</p>

    <p class="error-text" id="feedback-full-notice" hidden>Entries maxed out (20/20) -- please contact the admin.</p>
    <form class="stacked" id="feedback-form">
      <textarea id="feedback-message" rows="4" maxlength="2000" required placeholder="e.g. Please add KiiiKiii, or: search doesn't find articles about ..."></textarea>
      <button type="submit" class="primary">Post</button>
      <p class="error-text" id="feedback-error"></p>
    </form>

    <ul class="feedback-list" id="feedback-list">
      <li class="hint">Loading...</li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=13"></script>
  <script src="js/supabase-client.js?v=13"></script>
  <script src="js/feedback.js?v=13"></script>
</body>
</html>
