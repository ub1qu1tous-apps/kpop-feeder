<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kpop-feeder</title>
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <img src="img/logo.png?v=14" alt="K-pop Feeder -- feed your K-pop passion" class="brand-logo" />
      <div class="header-links">
        <a href="feedback.html" class="feedback-btn">Feedback / request a group</a>
        <a href="login.html" class="admin-corner">admin</a>
      </div>
    </header>

    <h1>Pick a group</h1>
    <p class="status-line" id="fetch-status-line"></p>
    <div class="group-grid" id="group-grid">
      <p class="hint">Loading groups...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=14"></script>
  <script src="js/supabase-client.js?v=14"></script>
  <script src="js/index.js?v=14"></script>
</body>
</html>
